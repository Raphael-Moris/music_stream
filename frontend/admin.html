<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panneau d'Administration - MusicStream</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
            color: #fff;
            min-height: 100vh;
            padding: 24px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
            padding-bottom: 24px;
            border-bottom: 1px solid #2a2a2a;
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .header-title h1 {
            font-size: 32px;
            background: linear-gradient(135deg, #ff6b35, #ff8c42);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .badge {
            background: linear-gradient(135deg, #ff6b35, #ff8c42);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
        }

        .btn {
            padding: 12px 20px;
            background: linear-gradient(135deg, #ff6b35, #ff8c42);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }

        .btn:hover {
            box-shadow: 0 8px 20px rgba(255, 107, 53, 0.4);
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: #2a2a2a;
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .btn-secondary:hover {
            background: #3a3a3a;
            box-shadow: none;
        }

        .btn-danger {
            background: #dc2626;
        }

        .btn-danger:hover {
            background: #b91c1c;
            box-shadow: 0 8px 20px rgba(220, 38, 38, 0.4);
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }

        .stat-card {
            background: linear-gradient(135deg, #1a1a1a, #252525);
            border: 1px solid #2a2a2a;
            border-radius: 16px;
            padding: 24px;
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-4px);
            border-color: #ff6b35;
        }

        .stat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .stat-icon {
            width: 48px;
            height: 48px;
            background: rgba(255, 107, 53, 0.1);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ff6b35;
        }

        .stat-value {
            font-size: 36px;
            font-weight: 700;
            background: linear-gradient(135deg, #ff6b35, #ff8c42);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 4px;
        }

        .stat-label {
            color: #999;
            font-size: 14px;
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 32px;
            border-bottom: 1px solid #2a2a2a;
            overflow-x: auto;
        }

        .tab {
            padding: 14px 24px;
            background: none;
            border: none;
            color: #999;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.3s ease;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tab:hover {
            color: #fff;
        }

        .tab.active {
            color: #ff6b35;
            border-bottom-color: #ff6b35;
        }

        /* Tab Content */
        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Table */
        .table-container {
            background: linear-gradient(135deg, #1a1a1a, #252525);
            border: 1px solid #2a2a2a;
            border-radius: 16px;
            padding: 24px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            text-align: left;
            padding: 12px;
            border-bottom: 1px solid #2a2a2a;
            color: #999;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
        }

        td {
            padding: 16px 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        tr:hover {
            background: rgba(255, 107, 53, 0.05);
        }

        /* Info Grid */
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 24px;
        }

        .info-card {
            background: linear-gradient(135deg, #1a1a1a, #252525);
            border: 1px solid #2a2a2a;
            border-radius: 16px;
            padding: 20px;
        }

        .info-card-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 16px;
            color: #ff6b35;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .info-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .info-item:last-child {
            border-bottom: none;
        }

        .info-label {
            color: #999;
            font-size: 14px;
        }

        .info-value {
            color: #fff;
            font-size: 14px;
            font-weight: 600;
        }

        /* Status Badge */
        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-success {
            background: rgba(34, 197, 94, 0.15);
            color: #4ade80;
        }

        .status-error {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
        }

        .status-warning {
            background: rgba(251, 191, 36, 0.15);
            color: #fbbf24;
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #2a2a2a;
            border-top-color: #ff6b35;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-state i {
            width: 64px;
            height: 64px;
            margin-bottom: 16px;
            opacity: 0.3;
        }

        /* Notification Container */
        #notificationContainer {
            position: fixed;
            top: 24px;
            right: 24px;
            z-index: 10000;
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 400px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            body {
                padding: 16px;
            }

            .header {
                flex-direction: column;
                gap: 16px;
                align-items: flex-start;
            }

            .tabs {
                flex-wrap: wrap;
            }

            .stat-value {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>
    <div id="notificationContainer"></div>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="header-title">
                <div class="stat-icon">
                    <i data-lucide="shield-check" style="width: 28px; height: 28px;"></i>
                </div>
                <div>
                    <h1>Panneau d'Administration</h1>
                    <div style="display: flex; gap: 8px; margin-top: 8px;">
                        <span class="badge">ADMIN</span>
                        <span id="serverStatus" class="status-badge status-success">Serveur actif</span>
                    </div>
                </div>
            </div>
            <a href="index.html" class="btn btn-secondary">
                <i data-lucide="arrow-left"></i> Retour à l'application
            </a>
        </div>

        <!-- Stats Overview -->
        <div id="statsGrid" class="stats-grid">
            <div class="loading">
                <div class="loading-spinner"></div>
                Chargement des statistiques...
            </div>
        </div>

        <!-- Tabs -->
        <div class="tabs">
            <button class="tab active" data-tab="users">
                <i data-lucide="users"></i> Utilisateurs
            </button>
            <button class="tab" data-tab="songs">
                <i data-lucide="music"></i> Chansons
            </button>
            <button class="tab" data-tab="server">
                <i data-lucide="server"></i> Serveur
            </button>
            <button class="tab" data-tab="database">
                <i data-lucide="database"></i> Base de données
            </button>
        </div>

        <!-- Tab Content: Users -->
        <div id="users" class="tab-content active">
            <div id="usersContent" class="table-container">
                <div class="loading">
                    <div class="loading-spinner"></div>
                    Chargement des utilisateurs...
                </div>
            </div>
        </div>

        <!-- Tab Content: Songs -->
        <div id="songs" class="tab-content">
            <div id="songsContent" class="table-container">
                <div class="loading">
                    <div class="loading-spinner"></div>
                    Chargement des chansons...
                </div>
            </div>
        </div>

        <!-- Tab Content: Server -->
        <div id="server" class="tab-content">
            <div id="serverContent">
                <div class="loading">
                    <div class="loading-spinner"></div>
                    Chargement des informations serveur...
                </div>
            </div>
        </div>

        <!-- Tab Content: Database -->
        <div id="database" class="tab-content">
            <div id="databaseContent">
                <div class="loading">
                    <div class="loading-spinner"></div>
                    Chargement des informations BDD...
                </div>
            </div>
        </div>
    </div>

    <script src="admin.js"></script>
</body>
</html>
